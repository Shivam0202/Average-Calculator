<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Average of Two Numbers</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #111827;
    }
    .box {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 280px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    #output {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      background: #eef6ff;
      font-size: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>Average Calculator</h3>
    
    <label>First Number:</label>
    <input type="number" id="num1" placeholder="Enter first number">

    <label>Second Number:</label>
    <input type="number" id="num2" placeholder="Enter second number">

    <button id="calc-btn" py-click="calculate">Calculate Average</button>

    <div id="output"></div>
  </div>

  <!-- Real Python execution in the browser -->
  <script type="py">
    from pyscript import document, window

    def speak(text):
        speech = window.SpeechSynthesisUtterance.new(text)
        speech.rate = 1
        speech.pitch = 1
        window.speechSynthesis.speak(speech)

    def calculate(event):
        v1 = document.querySelector("#num1").value
        v2 = document.querySelector("#num2").value
        output = document.querySelector("#output")

        if v1 and v2:
            num1 = float(v1)
            num2 = float(v2)
            total = num1 + num2
            avg = total / 2
            
            # Show output on screen
            output.style.display = "block"
            output.style.background = "#eef6ff"
            output.innerHTML = f"🎉 <strong>Wow Pratyush!</strong><br><strong>Total:</strong> {total}<br><strong>Average:</strong> {avg}"
            
            # Speak aloud
            speak("Wow Pratyush! The average is " + str(avg))
        else:
            output.style.display = "block"
            output.style.background = "#ffebee"
            output.innerHTML = "Please enter both numbers."
            speak("Please enter both numbers.")
  </script>

</body>
</html>
