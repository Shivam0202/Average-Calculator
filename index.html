<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Average of Two Numbers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    .box {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 280px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    #output {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      background: #eef6ff;
      font-size: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>Average Calculator</h3>
    
    <label>First Number:</label>
    <input type="number" id="num1" placeholder="Enter first number">

    <label>Second Number:</label>
    <input type="number" id="num2" placeholder="Enter second number">

    <button onclick="getAverage()">Calculate Average</button>

    <div id="output"></div>
  </div>

  <script>
    async function getAverage() {
      const n1 = document.getElementById("num1").value;
      const n2 = document.getElementById("num2").value;
      const output = document.getElementById("output");

      if (n1 === "" || n2 === "") {
        output.style.display = "block";
        output.style.background = "#ffebee";
        output.innerText = "Please fill in both numbers.";
        return;
      }

      try {
        const res = await fetch("/.netlify/functions/average", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ num1: n1, num2: n2 })
        });

        const data = await res.json();
        output.style.display = "block";

        if (res.ok) {
          output.style.background = "#eef6ff";
          output.innerHTML = `<strong>Total:</strong> ${data.total}<br><strong>Average:</strong> ${data.average}`;
        } else {
          output.style.background = "#ffebee";
          output.innerText = data.error;
        }
      } catch (err) {
        output.style.display = "block";
        output.style.background = "#ffebee";
        output.innerText = "Error connecting to server.";
      }
    }
  </script>

</body>
</html>
